name: Bug report
description: Report a reproducible problem with LivePass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please remove secrets, tokens, and personal data from logs before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend and frontend
        2. Sign in as an organizer
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or stack traces with secrets removed.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication / roles
        - Event registration / capacity
        - QR token / scanning
        - Offline queue / sync
        - Realtime dashboard (Socket.IO)
        - AI insights
        - Frontend UI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python, Node.js, and PostgreSQL versions.
      placeholder: Windows 11, Chrome 140, Python 3.12, Node 22, PostgreSQL 15
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings, or related issues.
    validations:
      required: false
